name: cycle_guard
description: "CHARI-PI (チャリッピー) - Cycling safety navigation app for Japan"
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Map
  google_maps_flutter: 2.14.2
  latlong2: ^0.9.1

  # HTTP
  http: 1.5.0
  dio: ^5.4.0

  # Local Storage
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.5.3

  # State Management
  provider: 6.1.5+1

  # Firebase
  firebase_core: 3.6.0
  cloud_firestore: 5.4.3

  # UI
  google_fonts: ^6.1.0

  # GPS & Permissions (Android/iOS)
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Alert System
  flutter_tts: ^4.2.0

  # Ride UX
  wakelock_plus: ^1.2.8

  # Utilities
  url_launcher: ^6.2.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
