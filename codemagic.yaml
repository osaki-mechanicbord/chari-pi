workflows:

  # ============================================================
  #  iOS - Build & Publish to App Store Connect / TestFlight
  # ============================================================
  ios-release:
    name: iOS Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cycleguard.safety
      vars:
        APP_STORE_APPLE_ID: 0000000000  # TODO: App Store Connect の Apple ID に置き換え
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up local.properties
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Flutter analyze
        script: flutter analyze --no-fatal-warnings
      - name: Build iOS
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
      email:
        recipients:
          - osaki-mechanicbord@users.noreply.github.com
        notify:
          success: true
          failure: true
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: "v*"
          include: true

  # ============================================================
  #  Android - Build & Publish to Google Play
  # ============================================================
  android-release:
    name: Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - cycle_guard_keystore  # Codemagic にアップロードした keystore 名
      groups:
        - google_play_credentials  # Google Play API キーのグループ名
      vars:
        PACKAGE_NAME: com.cycleguard.safety
      flutter: stable
      java: 17
    scripts:
      - name: Set up local.properties
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Flutter analyze
        script: flutter analyze --no-fatal-warnings
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/**/*.aab
      - build/app/outputs/flutter-apk/**/*.apk
      - flutter_drive.log
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal  # internal -> alpha -> beta -> production
        submit_as_draft: true
      email:
        recipients:
          - osaki-mechanicbord@users.noreply.github.com
        notify:
          success: true
          failure: true
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: "v*"
          include: true
