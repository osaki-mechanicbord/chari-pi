workflows:

  # ============================================================
  #  Android - Build & Download AAB (手動で Google Play にアップロード)
  #  ※ iOS は Workflow Editor (GUI) で管理
  # ============================================================
  android-release:
    name: Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - cycle_guard_keystore
      vars:
        PACKAGE_NAME: com.cycleguard.safety
      flutter: stable
      java: 17
    scripts:
      - name: Set up local.properties
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Flutter analyze
        script: flutter analyze --no-fatal-warnings
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/**/*.aab
      - build/app/outputs/flutter-apk/**/*.apk
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - osaki-mechanicbord@users.noreply.github.com
        notify:
          success: true
          failure: true
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: "v*"
          include: true
