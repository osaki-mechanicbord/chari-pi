workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: Codemagic
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up iOS code signing
        script: |
          keychain initialize
          
          # Fetch signing files and capture output
          app-store-connect fetch-signing-files "com.cycleguard.safety" \
            --type IOS_APP_STORE \
            --create
          
          keychain add-certificates
          
          # Debug: list profiles
          echo "=== Provisioning Profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "No profiles directory"
          
          # Debug: list certificates
          echo "=== Certificates ==="
          security find-identity -v -p codesigning || echo "No certificates"
          
          xcode-project use-profiles
          
          # Debug: verify project settings after use-profiles
          echo "=== Xcode project signing after use-profiles ==="
          grep -A2 "CODE_SIGN_STYLE\|PROVISIONING_PROFILE\|DEVELOPMENT_TEAM" ios/Runner.xcodeproj/project.pbxproj | head -30
      - name: Build Android APK (Debug)
        script: |
          flutter build apk --debug
      - name: Flutter build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Build iOS IPA with Codemagic
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
